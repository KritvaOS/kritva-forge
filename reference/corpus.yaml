# Single source of truth of the reference corpus (scripts/reference/corpus.py).
# Every materialized file is listed explicitly; changing a commit, a file, an
# include directory or an exclusion requires a reviewed baseline update
# (make reference-baseline, reference/expected/summary.json).
schema:
  name: kritva-forge-reference-corpus
  version: 1
ips:
  # AES-128 cipher / inverse cipher with register interface (security_core)
  - id: aes
    submodule: reference/sources/security_core
    repository: https://github.com/dineshannayya/security_core.git
    commit: de2e6a5333261f94ef7f14a0c401eb5ced9bed04
    license: Apache-2.0
    root: "verilog/rtl"
    incdirs: []
    files:
      - aes128/core/aes_cipher_top.sv
      - aes128/core/aes_inv_cipher_top.sv
      - aes128/core/aes_inv_sbox.sv
      - aes128/core/aes_key_expand_128.sv
      - aes128/core/aes_rcon.sv
      - aes128/core/aes_sbox.sv
      - aes128/top/aes_reg.sv
      - aes128/top/aes_top.sv
      - lib/ctech_cells.sv
      - lib/registers.v
      - lib/reset_sync.sv
    exclusions: []
    external_includes: []
  # IEEE-754 single / double precision floating point unit
  - id: fpu
    submodule: reference/sources/fpu
    repository: https://github.com/dineshannayya/fpu.git
    commit: 621d988a3c2cc0be61e74bd29a6fcf4a923308f9
    license: Apache-2.0
    root: "verilog/rtl"
    incdirs: ["."]
    files:
      - double_to_float.v
      - double_to_long.v
      - float_to_double.v
      - fpu_dp_add.sv
      - fpu_dp_div.sv
      - fpu_dp_mul.sv
      - fpu_dp_top.sv
      - fpu_parms.v
      - fpu_sp_add.sv
      - fpu_sp_div.sv
      - fpu_sp_f2i.sv
      - fpu_sp_i2f.sv
      - fpu_sp_mul.sv
      - fpu_sp_top.sv
      - fpu_top.sv
      - long_to_double.v
    exclusions: []
    external_includes: []
  # Quad-SPI master
  - id: qspi
    submodule: reference/sources/qspim
    repository: https://github.com/dineshannayya/qspim.git
    commit: 55f8c4323611a33a0e01f8066940fb6d76ffa12a
    license: Apache-2.0
    root: ""
    incdirs: []
    files:
      - lib/ctech_cells.sv
      - lib/reset_sync.sv
      - src/qspim_clkgen.sv
      - src/qspim_ctrl.sv
      - src/qspim_fifo.sv
      - src/qspim_if.sv
      - src/qspim_regs.sv
      - src/qspim_rx.sv
      - src/qspim_tx.sv
    exclusions:
      - path: src/qspim_top.sv
        reason: external_parent_soc_include:user_reg_map.svh
    external_includes: []
  # Real-time clock
  - id: rtc
    submodule: reference/sources/rtc
    repository: https://github.com/dineshannayya/rtc.git
    commit: 48943b7aa6ce9d66fd23db83417a7a097376c21d
    license: Apache-2.0
    root: "verilog/rtl"
    incdirs: []
    files:
      - core/rtc_core.sv
      - core/rtc_reg.sv
      - core/rtc_top.sv
      - lib/async_reg_bus.sv
      - lib/ctech_cells.sv
      - lib/reset_sync.sv
    exclusions: []
    external_includes: []
  # YCR1 RISC-V core (ycr1cr; not the private ycr2-based yifive IP)
  - id: ycr1
    submodule: reference/sources/ycr1cr
    repository: https://github.com/dineshannayya/ycr1cr.git
    commit: a6c76b34a44ceee89c3876f67f3761a60540fa00
    license: Apache-2.0
    root: "src"
    incdirs: ["includes"]
    files:
      - cache/src/core/dcache_tag_fifo.sv
      - cache/src/core/dcache_top.sv
      - cache/src/core/icache_app_fsm.sv
      - cache/src/core/icache_tag_fifo.sv
      - cache/src/core/icache_top.sv
