name: Kritva Forge CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-header:
    name: Source Header Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate source headers
        run: |
          python3 scripts/lint/check_source_headers.py             --mode tracked             --strict

      - name: Run header checker tests
        run: |
          python3 tests/lint/test_source_headers.py

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt
          fi

      - name: Run tests
        run: |
          python3 -m pytest -q

  forge-gate:
    name: Kritva Forge Gate
    if: ${{ always() }}
    needs:
      - source-header
      - python-tests
    runs-on: ubuntu-latest

    steps:
      - name: Verify required jobs passed
        env:
          HEADER_RESULT: ${{ needs.source-header.result }}
          TEST_RESULT: ${{ needs.python-tests.result }}
        run: |
          echo "Source Header Check: ${HEADER_RESULT}"
          echo "Python Tests:        ${TEST_RESULT}"

          test "${HEADER_RESULT}" = "success"
          test "${TEST_RESULT}" = "success"
